---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@200ecc2700e264c0fd90c78f73de9a9900211dbd # main
    # Bot PRs can't author changelog fragments, and hand-adding one to a
    # Renovate branch freezes Renovate ("PR Edited") — skip the gate for bots;
    # all_green treats a skipped job as passing.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@200ecc2700e264c0fd90c78f73de9a9900211dbd # main
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@200ecc2700e264c0fd90c78f73de9a9900211dbd # main
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@200ecc2700e264c0fd90c78f73de9a9900211dbd # main
  molecule:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # only needs to read the repo; GITHUB_TOKEN is for release-API rate limits
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - host_prep
          - packages
          - docker
          - podman
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule

      - name: Smoke test molecule ${{ matrix.scenario }}
        run: molecule test -s ${{ matrix.scenario }}
        env:
          # mise install fetches many GitHub releases; the token raises the
          # anonymous 60/hr API limit so the packages scenario doesn't rate-limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - ansible-lint
      - molecule
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.changelog.result }}',
          '${{ needs.build-import.result }}',
          '${{ needs.sanity.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.molecule.result }}',
          ])"
