---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@dc47efd46c312b6ffaf10c274825707a65ac1d86 # main
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@dc47efd46c312b6ffaf10c274825707a65ac1d86 # main
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@dc47efd46c312b6ffaf10c274825707a65ac1d86 # main
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@dc47efd46c312b6ffaf10c274825707a65ac1d86 # main
  molecule:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # only needs to read the repo; GITHUB_TOKEN is for release-API rate limits
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - host_prep
          - packages
          - docker
          - podman
          - ghapp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule

      - name: Smoke test molecule ${{ matrix.scenario }}
        run: molecule test -s ${{ matrix.scenario }}
        env:
          # mise install fetches many GitHub releases; the token raises the
          # anonymous 60/hr API limit so the packages scenario doesn't rate-limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - ansible-lint
      - molecule
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.changelog.result }}',
          '${{ needs.build-import.result }}',
          '${{ needs.sanity.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.molecule.result }}',
          ])"
